<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101724"><meta name="description" content="Bite-sized learning for curious minds."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>MindFeed</title></head><body>
<header><div class="brand"><span class="mark">✳</span> mindfeed<span class="dot">.</span></div><span class="tagline">Learn something worth keeping.</span><button id="install" hidden>Install</button></header>
<section class="toolbar"><div class="topline"><label for="category" class="sr">Topic</label><select id="category"><option value="All">All topics</option></select><button id="shuffle">↻ Shuffle</button><span id="count" aria-live="polite"></span></div><div class="tabs" role="group" aria-label="Feed views"><button data-view="feed" aria-pressed="true">For you</button><button data-view="saved" aria-pressed="false">Saved</button><button data-view="progress" aria-pressed="false">Progress</button></div></section>
<main id="feed" tabindex="0" aria-label="Learning feed"></main><section id="progress" hidden></section><footer id="navigation"><button id="prev" aria-label="Previous insight">↑</button><span>Swipe up for the next insight</span><button id="next" aria-label="Next insight">↓</button></footer>
<dialog id="rabbit"><div class="dialoghead"><h2>Explore related ideas</h2><button id="closeRabbit" aria-label="Close related ideas">×</button></div><div id="related"></div></dialog><div id="toast" role="status"></div><script src="app.js" defer></script></body></html>
